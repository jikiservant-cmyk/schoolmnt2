name: Dependency review

# Blocks pull requests that add a dependency with a known advisory (backed by
# the repository dependency graph). Complements Dependabot, which watches the
# dependencies you already have.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Only runtime dependencies gate the merge. Dev-only tooling
          # (firebase-tools and friends) carries a long advisory tail that
          # should not block unrelated pull requests; Dependabot still reports
          # it in the Security tab.
          fail-on-scopes: runtime
